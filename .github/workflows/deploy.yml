# =============================================================================
# Deploy parselex.app landing to GitHub Pages
# =============================================================================
# The landing is a set of 6 self-contained static HTML pages (EN at root,
# uk/ru/es/fr/hi in path-prefixed folders) plus /login/, /changelog/, robots.txt,
# sitemap.xml and og.png (social preview). The committed HTML is generated by
# scripts/build_landing.py from scripts/content_*.py content modules.
#
# CI rebuilds the site from the content modules on every push and deploys the
# fresh build, so the deployed site is always in sync with scripts/content_*.
# Pages are fully self-contained (inline CSS/JS, zero external resources,
# zero images) — verified in CI.
#
# One-time repo setup (Settings → Pages): Source = "GitHub Actions",
# Custom domain = parselex.app (from the CNAME file), then "Enforce HTTPS"
# once the certificate is provisioned.
#
# Trigger: push to main + manual workflow_dispatch
# Output:  https://parselex.app  (via Cloudflare → GitHub Pages)
# =============================================================================

name: Deploy Landing Pages

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "index.html"
      - "uk/**"
      - "ru/**"
      - "es/**"
      - "fr/**"
      - "hi/**"
      - "login/**"
      - "changelog/**"
      - "og.png"
      - "CNAME"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build landing (6 locales)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild site from content modules
        run: python scripts/build_landing.py --out site

      - name: Verify artifact integrity
        run: |
          set -euo pipefail
          # All 6 locale pages exist and are non-empty
          for p in site/index.html site/uk/index.html site/ru/index.html \
                   site/es/index.html site/fr/index.html site/hi/index.html; do
            test -s "$p" || { echo "MISSING or EMPTY: $p"; exit 1; }
          done
          # EN page: correct canonical + full hreflang set (6 locales + x-default)
          grep -q '<link rel="canonical" href="https://parselex.app/">' site/index.html
          n_alt=$(grep -c 'rel="alternate" hreflang' site/index.html || true)
          test "${n_alt:-0}" -ge 7 || { echo "hreflang set incomplete ($n_alt < 7)"; exit 1; }
          # Ukrainian page is canonical under /uk/ and declares lang=uk
          grep -q '<html lang="uk">' site/uk/index.html
          grep -q '<link rel="canonical" href="https://parselex.app/uk/">' site/uk/index.html
          # SEO files + social preview image present
          test -s site/robots.txt || { echo "MISSING: robots.txt"; exit 1; }
          grep -q 'Sitemap: https://parselex.app/sitemap.xml' site/robots.txt
          test -s site/sitemap.xml || { echo "MISSING: sitemap.xml"; exit 1; }
          grep -q '<loc>https://parselex.app/uk/</loc>' site/sitemap.xml
          test -s site/og.png || { echo "MISSING: og.png"; exit 1; }
          grep -q 'property="og:image" content="https://parselex.app/og.png"' site/index.html
          # Self-contained: no external <img|script|iframe> sources allowed
          if grep -nE '<(img|script|iframe)[^>]+src="https?://' \
               site/index.html site/*/index.html; then
            echo "External resource found — site must stay self-contained"; exit 1
          fi
          # Custom domain marker present
          test "$(cat CNAME)" = "parselex.app"
          echo "artifact OK: $(find site -name '*.html' | wc -l) pages"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
